</style></head><body>
<header><div class="wrap hd2"><h1 onclick="go('Home')" style="cursor:pointer" title="Home">NBA <span>HUB</span><span class="ver">v15</span></h1><div class="tabs" id="tabs"></div><button class="chip favb" id="favbtn" title="Choose or change your team" onclick="pickTeam()">★ Pick your team</button></div></header>
<div class="wrap"><div id="vb"></div><div class="tick" id="tick"></div></div>
<main class="wrap" id="main"></main>
<nav class="bn" id="bn"></nav>
<div class="ov" id="m"><div class="sheet" id="s"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const api=async p=>{const r=await fetch(p,{cache:"no-store"});if(!r.ok){let m=String(r.status);try{m+=": "+(await r.json()).error}catch(e){}throw new Error(m)}return r.json()};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let tab="Home",date=new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"}),games=[],sel=null,box=null,side="away",sub="box",teams=[],stand=[],news=[],tnews=[],sched=[],nf="all",err="";
let bsort=null,bdir=-1,boxErr="",pstats=null,ploading=false,perr="",psort="PTS",pdir=-1,sview="players";
let sdate=date,sgames=[],schTeam="",tsch={},schErr="",sload=false,hconf="",cm=date.slice(0,7),mcache={},live=[],recent=[];
let fav=null;try{fav=JSON.parse(localStorage.getItem("fav"))}catch(e){}
let evs=null,hl=null,hlErr="",hlLoading=false,hlCh="",hlView=[],stT="";
const L=(t,s=34)=>t?`<img src="${esc(t.logo)}" alt="${esc(t.abbr)}" width="${s}" height="${s}" style="object-fit:contain" onerror="this.replaceWith(document.createTextNode(this.alt))">`:"";
const lbl=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const etD=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"America/New_York"});
const tm=d=>new Date(d).toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"})+" ET";
const ago=d=>{const h=(Date.now()-new Date(d))/36e5;return h<1?Math.max(1,Math.round(h*60))+"m ago":h<24?Math.round(h)+"h ago":Math.round(h/24)+"d ago"};
const safe=u=>u&&u.startsWith("https://")?esc(u):"#";
const TABS=[["Home","⌂"],["Scores","🏀"],["Schedule","📅"],["Teams","👥"],["Stats","📊"],["Leaders","🏆"],["News","📰"]];
const go=t=>{tab=t;draw();scrollTo(0,0);if(t=="Stats"||t=="Leaders")loadPlayers();if(t=="Schedule")loadSched();if(t=="Home"){loadRecent();if(!hl&&!hlLoading)loadHL()}};
const gm=()=>games.find(g=>g.id==sel)||live.find(g=>g.id==sel)||recent.find(g=>g.id==sel);

async function loadGames(){const old=JSON.stringify(games)+err+JSON.stringify(live);try{games=await api("/api/scoreboard?date="+date);err=""}catch(e){games=[];err="Couldn't load games ("+e.message+"). Retrying automatically."}
try{live=await api("/api/live")}catch(e){}
if(!gm())sel=(live[0]||games.find(g=>g.state=="in")||games[0]||{}).id||null;await loadBox(old!=JSON.stringify(games)+err+JSON.stringify(live))}
async function loadBox(f){if(!sel){box=null;return draw()}const old=JSON.stringify(box);try{box=await api("/api/game/"+sel);boxErr=""}catch(e){box=null;boxErr=e.message;f=true}if(f||old!=JSON.stringify(box))draw()}
function pick(id){sel=id;box=null;boxErr="";draw();loadBox();const p=$("#gp");if(p)p.scrollIntoView({behavior:"smooth",block:"start"})}
function shift(n){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);date=iso(d);sel=null;box=null;loadGames()}
async function loadFav(){if(!fav)return;try{sched=await api("/api/schedule/"+fav.id)}catch(e){sched=[]}try{tnews=await api("/api/news?team="+fav.id)}catch(e){tnews=[]}draw()}
function setFav(id){fav=teams.find(t=>t.id==id)||null;try{if(fav)localStorage.setItem("fav",JSON.stringify(fav));else localStorage.removeItem("fav");localStorage.setItem("favAsked","1")}catch(e){}sched=[];tnews=[];if(!fav&&nf=="team")nf="all";draw();loadFav()}

function hero(){const lv=games.filter(g=>g.state=="in").length;return`<div class="hero"><b>${lv?lv+" live now":games.length?games.length+" games":"No games"}<br>${esc(lbl(date))}</b><span>${games.length?"Tap any game for the box score":"Use the arrows to find the next game day"}</span></div>`}
function liveRow(){const v=games.filter(g=>g.state=="in");return`<div class="sec"><h2>Live Now</h2><a onclick="go('Scores')">See All ›</a></div>`+(v.length?`<div class="hs">${v.map(g=>`<div class="card" onclick="openGame('${g.id}')"><span class="live">LIVE</span> <small>${esc(g.detail)}</small><div class="sc3"><div>${L(g.away)}<b>${g.away.score}</b><small>${esc(g.away.abbr)}</small></div><div>${L(g.home)}<b>${g.home.score}</b><small>${esc(g.home.abbr)}</small></div></div></div>`).join("")}</div>`:`<div class="note">No games are live right now.</div>`)}
function rec(){for(const c of stand){const i=c.rows.findIndex(r=>r.id==fav.id);if(i>=0)return`${c.rows[i].w}-${c.rows[i].l} | #${i+1} in ${esc(c.conf)}`}return""}
function my(){const chg=`<button class="chip" style="margin:0;background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)" onclick="pickTeam()">`;
if(!fav)return`<div class="sec"><h2>★ My Team</h2></div><div class="card my"><div>Choose your team for its schedule, news and quick links.</div>${chg}Choose your team</button></div>`;
const n=sched.find(g=>g.state!="post"),at=n&&n.away.id==fav.id;
return`<div class="sec"><h2>★ My Team</h2><a onclick="go('Teams')">See Team ›</a></div><div class="card my"><div style="display:flex;gap:10px;align-items:center">${L(fav,54)}<div><b style="font-size:18px">${esc(fav.name)}</b><div style="opacity:.8">${rec()}</div></div></div><div class="nx"><small style="opacity:.8">Next game</small><div><b>${n?(at?"@ "+esc(n.home.abbr):"vs "+esc(n.away.abbr)):"—"}</b></div><small>${n?esc(lbl(etD(n.date)))+" · "+tm(n.date):""}</small></div>${chg}Change team</button><div class="qa"><button onclick="roster('${fav.id}')">Roster</button><button onclick="go('Schedule')">Schedule</button><button onclick="go('Stats')">Stats</button><button onclick="nf='team';go('News')">Team News</button></div></div>`}
function newsCards(a){return a.length?`<div class="hs">${a.slice(0,10).map(x=>`<a class="card" href="${safe(x.link)}" target="_blank" rel="noopener">${x.img?`<img class="n" src="${safe(x.img)}" alt="" loading="lazy">`:""}<b>${esc(x.title)}</b><div style="color:var(--mut);font-size:12px;margin-top:4px">${ago(x.time)}</div></a>`).join("")}</div>`:`<div class="note">No headlines available right now.</div>`}
